<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Índice de presentaciones disponibles en este repositorio." />
    <title>Presentaciones</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <p class="eyebrow">Repositorio de presentaciones</p>
        <h1>Presentaciones disponibles</h1>
        <p class="lead">
          Elegí una carpeta para abrir su subpath correspondiente.
        </p>
      </section>

      <section class="grid" aria-label="Lista de presentaciones">
        <a class="card" href="/belada-padel/">
          <span class="card-kicker">01</span>
          <span class="card-title">Belada Padel</span>
          <span class="card-path">/belada-padel/</span>
        </a>

        <a class="card" href="/copa-marea/">
          <span class="card-kicker">02</span>
          <span class="card-title">Copa Marea V2</span>
          <span class="card-path">/copa-marea/</span>
        </a>

        <a class="card" href="/pepsi-mango-beat/">
          <span class="card-kicker">03</span>
          <span class="card-title">Pepsi Mango Beat</span>
          <span class="card-path">/pepsi-mango-beat/</span>
        </a>

        <a class="card" href="/roxom-tv-podcast/">
          <span class="card-kicker">04</span>
          <span class="card-title">Roxom TV Podcast</span>
          <span class="card-path">/roxom-tv-podcast/</span>
        </a>

        <a class="card" href="/kaiyi-argentina/">
          <span class="card-kicker">05</span>
          <span class="card-title">Kaiyi Argentina</span>
          <span class="card-path">/kaiyi-argentina/</span>
        </a>
      </section>
    </main>
  </body>
</html>
